<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hardware Monitor Settings</title>
  <link rel="stylesheet" href="../../libs/css/uspi.css">
  <style>
    @font-face {
      font-family: 'vivremotion';
      font-style: normal;
      font-weight: 400;
      src: url('../../libs/fonts/vivremotion.ttf');
    }
    @font-face {
      font-family: 'RajdhaniMedium';
      font-style: normal;
      font-weight: 500;
      src: url('../../libs/fonts/Rajdhani-Medium.ttf');
    }
    /* 数值型设置项（满量程 / 带宽上限）：数字输入框 + 单位后缀同行显示 */
    .uspi-scale { display: flex; align-items: center; gap: 6px; }
    .uspi-scale input { flex: 1 1 auto; min-width: 0; }
    .uspi-scale-unit { flex: 0 0 auto; opacity: .72; font-size: 12px; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="uspi-wrapper hidden">
    <form id="property-inspector">

      <!-- Preset Style（所有控件通用）-->
      <div class="uspi-item">
        <div class="uspi-item-label" data-localize="presetStyle">Preset Style</div>
        <div class="uspi-item-value">
          <select id="presetSelect" class="uspi-item-value">
            <option value="gaming" data-localize="preset_gaming">🎮 Gaming</option>
            <option value="minimal" data-localize="preset_minimal">📊 Minimal</option>
            <option value="retro" data-localize="preset_retro">🕹️ Retro</option>
            <option value="cyberpunk" data-localize="preset_cyberpunk">🌆 Cyberpunk</option>
          </select>
        </div>
      </div>

      <!-- Chart Type（所有控件通用）-->
      <div class="uspi-item">
        <div class="uspi-item-label" data-localize="chartType">Chart Type</div>
        <div class="uspi-item-value">
          <select id="chartStyle" class="uspi-item-value">
            <option value="ring" data-localize="chart_ring">💍 Ring</option>
            <option value="wave" data-localize="chart_wave">🌊 Wave Chart</option>
          </select>
        </div>
      </div>

      <!-- Hardware Selection：按控件类型显示（CPU / GPU / 风扇 / 网卡），选项实时枚举自 LHM -->
      <div class="uspi-item" id="hwSelectItem" style="display:none">
        <div class="uspi-item-label" id="hwSelectLabel">Hardware</div>
        <div class="uspi-item-value">
          <select id="hwSelect" class="uspi-item-value">
            <option value="" id="hwSelectAuto">Auto</option>
          </select>
        </div>
      </div>

      <!-- Range Max：非百分比控件显示（TDP / 频率上限 / 温度 / 显存 / 内存 / 转速），留空 = 自动 -->
      <div class="uspi-item" id="scaleItem" style="display:none">
        <div class="uspi-item-label" id="scaleLabel">Range Max</div>
        <div class="uspi-item-value uspi-scale">
          <input id="scaleInput" class="uspi-item-value" type="number" min="0" step="any" placeholder="Auto">
          <span class="uspi-scale-unit" id="scaleUnit"></span>
        </div>
      </div>

      <!-- 网络带宽上限：仅 Network Upload / Download 显示（由 uuid 末段决定）-->
      <div class="uspi-item" id="netLimitItem" style="display:none">
        <div class="uspi-item-label" data-localize="netLimitLabel">Bandwidth Cap</div>
        <div class="uspi-item-value uspi-scale">
          <input id="netMaxMbps" class="uspi-item-value" type="number" min="0" step="1" placeholder="Auto">
          <span class="uspi-scale-unit">Mbps</span>
        </div>
      </div>

    </form>
  </div>

  <script src="../../libs/js/constants.js"></script>
  <script src="../../libs/js/eventEmitter.js"></script>
  <script src="../../libs/js/timers.js"></script>
  <script src="../../libs/js/utils.js"></script>
  <script src="../../libs/js/ulanziApi.js"></script>

  <script src="./systemvitals.js"></script>
</body>
</html>
