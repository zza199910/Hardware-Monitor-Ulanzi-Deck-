<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <rect width="72" height="72" fill="#f0f0f0" rx="6"/>
  <!-- RAM module body -->
  <rect x="16" y="14" width="40" height="48" rx="2" fill="#1a5c3a" stroke="#0d3d25" stroke-width="1.5"/>
  <!-- Memory chips row 1 -->
  <rect x="21" y="19" width="10" height="16" rx="1" fill="#111"/>
  <rect x="33" y="19" width="10" height="16" rx="1" fill="#111"/>
  <rect x="45" y="19" width="6" height="16" rx="1" fill="#111"/>
  <!-- Memory chips row 2 -->
  <rect x="21" y="39" width="10" height="16" rx="1" fill="#111"/>
  <rect x="33" y="39" width="10" height="16" rx="1" fill="#111"/>
  <rect x="45" y="39" width="6" height="16" rx="1" fill="#111"/>
  <!-- Gold contacts at bottom -->
  <rect x="20" y="58" width="4" height="4" rx="0.5" fill="#d4a017"/>
  <rect x="27" y="58" width="4" height="4" rx="0.5" fill="#d4a017"/>
  <rect x="34" y="58" width="4" height="4" rx="0.5" fill="#d4a017"/>
  <rect x="41" y="58" width="4" height="4" rx="0.5" fill="#d4a017"/>
  <rect x="48" y="58" width="4" height="4" rx="0.5" fill="#d4a017"/>
</svg>
