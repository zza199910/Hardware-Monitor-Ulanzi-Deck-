<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <rect width="72" height="72" fill="#f0f0f0" rx="6"/>
  <!-- NIC / Network card body -->
  <rect x="12" y="24" width="48" height="28" rx="2" fill="#4a90b8" stroke="#2a6080" stroke-width="1.5"/>
  <!-- Screen/LED area -->
  <rect x="17" y="28" width="26" height="18" rx="1" fill="#1a3045"/>
  <!-- Screen content lines -->
  <line x1="21" y1="34" x2="39" y2="34" stroke="#6bb3d9" stroke-width="1.5"/>
  <line x1="21" y1="40" x2="35" y2="40" stroke="#6bb3d9" stroke-width="1.5"/>
  <!-- RJ-45 port shape -->
  <rect x="47" y="30" width="10" height="14" rx="1" fill="#222"/>
  <rect x="49" y="32" width="6" height="10" rx="0.5" fill="#111"/>
  <!-- Activity LEDs -->
  <circle cx="20" cy="49" r="2" fill="#4caf50"/>
  <circle cx="28" cy="49" r="2" fill="#f44336"/>
  <!-- Bottom connector pins -->
  <rect x="18" y="52" width="3" height="4" rx="0.5" fill="#333"/>
  <rect x="26" y="52" width="3" height="4" rx="0.5" fill="#333"/>
  <rect x="34" y="52" width="3" height="4" rx="0.5" fill="#333"/>
  <rect x="42" y="52" width="3" height="4" rx="0.5" fill="#333"/>
  <rect x="50" y="52" width="3" height="4" rx="0.5" fill="#333"/>
</svg>
